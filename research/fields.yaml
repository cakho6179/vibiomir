topic: "R2AI2026 Medical Retrieval (ViBioMIR) — Top 1 Strategy Research"

field_categories:
  - category: "Basic Info"
    fields:
      - name: name
        description: "Model / technique / dataset / tool name"
        detail_level: brief
        required: true
      - name: source_url
        description: "Official repo / HuggingFace / paper / docs URL"
        detail_level: brief
        required: true
      - name: type
        description: "embedding | reranker | sparse | llm | chunking | crawler | fusion | evaluation | dataset | pipeline | metric"
        detail_level: brief
        required: true
      - name: release_date
        description: "Release date (hard gate: must be before 2026-08-01 ICT)"
        detail_level: brief
        required: false

  - category: "Constraint Compliance"
    fields:
      - name: open_weight
        description: "Are model and/or training data public (HF...)? yes/no + evidence"
        detail_level: brief
        required: false
      - name: size_ok
        description: "Parameters <= 15B? yes/no + actual parameter count"
        detail_level: brief
        required: false
      - name: release_cutoff_ok
        description: "Released before 2026-08-01 (ICT)? yes/no + exact date"
        detail_level: brief
        required: false
      - name: license_ok
        description: "License usable for this competition (non-commercial research) + attribution duty"
        detail_level: brief
        required: false

  - category: "Technical"
    fields:
      - name: approach
        description: "How it works: architecture, mechanism, strengths and weaknesses"
        detail_level: detailed
        required: true
      - name: languages
        description: "Language coverage with focus on vi/en/zh"
        detail_level: moderate
        required: false
      - name: benchmark_scores
        description: "nDCG@10 / recall on BEIR, MIRACL, MS MARCO, Vietnamese and medical benchmarks"
        detail_level: moderate
        required: false
      - name: context_length
        description: "Max input tokens (drives chunk size and truncation policy)"
        detail_level: brief
        required: false

  - category: "Competition Fit"
    fields:
      - name: target_level
        description: "Where it applies: doc retrieval | chunk retrieval | query processing | corpus | scoring | ops | whole pipeline"
        detail_level: moderate
        required: true
      - name: gain_evidence
        description: "Quantified expected gain vs BM25 baseline 0.3764 (docs F2 0.5587 / chunks F2 0.1941), with sources"
        detail_level: detailed
        required: true
      - name: compute_cost
        description: "VRAM + runtime + disk for 1.22M corpus URLs (~2-3M chunks), local Windows/CPU and Kaggle T4 16GB"
        detail_level: detailed
        required: false
      - name: dev_proxy_strategy
        description: "How to validate offline without test labels (pseudo-labels, judge, sampled manual audit)"
        detail_level: moderate
        required: false
      - name: risk
        description: "Risks: crawl coverage, dead URLs, domain drift, latency, quota burn, rule violation, metric misread"
        detail_level: moderate
        required: true
      - name: integration_notes
        description: "Concrete interface: what to install, what inputs/outputs, where it plugs into our pipeline"
        detail_level: moderate
        required: true
      - name: decision
        description: "Recommendation: adopt | trial | reject | investigate further — with one-line justification"
        detail_level: brief
        required: true

  - category: "Evidence"
    fields:
      - name: sources
        description: "Evidence source list (URLs, papers, benchmarks, code files)"
        detail_level: moderate
        required: true
      - name: confidence
        description: "high | medium | low — reliability of the claims above"
        detail_level: brief
        required: true

uncertain:
  - name: "actual_crawl_coverage"
    description: "Share of the 1,220,598 URLs that is actually fetchable (measure by sampling crawl)"
  - name: "test_label_distribution"
    description: "Gold docs/chunks per query (drives optimal k and chunk budget)"
  - name: "gold_chunk_sizes"
    description: "Token length distribution of reference chunks (decides chunking strategy)"
  - name: "scorer_tokenizer_identity"
    description: "Which tokenizer (from tokenizers 0.13.3) the official scorer uses to compute |g|"
  - name: "medkb_overlap"
    description: "Whether the corpus text is reachable through MedKB public index"
