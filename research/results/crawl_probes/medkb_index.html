  <style>
    body {
      font-family: 'Noto Sans', 'Noto Sans SC', sans-serif;
    }

    /* Custom scrollbar for chat area */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes cursor-blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* DNA Helix Animation */
    @keyframes dna-rotate {
      0% {
        transform: translateX(-50%) rotateY(0deg) scaleX(1);
      }

      25% {
        transform: translateX(-50%) rotateY(90deg) scaleX(0.2);
      }

      50% {
        transform: translateX(-50%) rotateY(180deg) scaleX(1);
      }

      75% {
        transform: translateX(-50%) rotateY(270deg) scaleX(0.2);
      }

      100% {
        transform: translateX(-50%) rotateY(360deg) scaleX(1);
      }
    }

    .dna-pair {
      perspective: 200px;
      transform-style: preserve-3d;
    }

    /* Login Page Animations */
    @keyframes login-bg-float-1 {

      0%,
      100% {
        transform: translateY(0) rotate(0deg) scale(1);
      }

      50% {
        transform: translateY(-20px) rotate(10deg) scale(1.1);
      }
    }

    @keyframes login-bg-float-2 {

      0%,
      100% {
        transform: translateY(0) rotate(0deg) scale(1);
      }

      50% {
        transform: translateY(30px) rotate(-15deg) scale(1.2);
      }
    }

    @keyframes login-card-enter {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(30px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes login-deco-float-1 {

      0%,
      100% {
        transform: rotate(45deg) translateY(0);
      }

      50% {
        transform: rotate(45deg) translateY(-10px);
      }
    }

    @keyframes login-deco-float-2 {

      0%,
      100% {
        transform: rotate(-20deg) translateY(0);
      }

      50% {
        transform: rotate(-20deg) translateY(15px);
      }
    }

    @keyframes login-slide-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes login-shake {

      0%,
      100% {
        transform: translateX(0);
      }

      15%,
      45%,
      75% {
        transform: translateX(-4px);
      }

      30%,
      60%,
      90% {
        transform: translateX(4px);
      }
    }

    .login-bg-float-1 {
      animation: login-bg-float-1 8s ease-in-out infinite;
    }

    .login-bg-float-2 {
      animation: login-bg-float-2 10s ease-in-out infinite;
    }

    .login-card-enter {
      animation: login-card-enter 0.6s ease-out forwards;
    }

    .login-deco-float-1 {
      animation: login-deco-float-1 4s ease-in-out infinite;
    }

    .login-deco-float-2 {
      animation: login-deco-float-2 5s ease-in-out infinite;
    }

    .login-slide-up {
      animation: login-slide-up 0.5s ease-out both;
    }

    .login-shake {
      animation: login-shake 0.4s ease-in-out;
    }
  </style>
